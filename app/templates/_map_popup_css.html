{# Shared popup styles for feature maps (collection, items, item, map_edit, map_view, item_edit, collections). #}
<style>
  .maplibregl-popup { z-index: 1000; }
  .maplibregl-popup-content {

    max-width: 360px;
    max-height: 320px;
    overflow: auto;
    background: #fff !important;
    color: #000 !important;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .map-popup { min-width: 160px; max-width: 100%; font-size: 0.85rem; color: #000; word-break: break-word; }
  .map-popup-id { margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #ccc; }
  .map-popup-id a { color: #1967d2; text-decoration: none; }
  .map-popup-id a:hover { text-decoration: underline; }

  .map-popup-desc-value { font-size: 0.9rem; margin-bottom: 8px; color: #000; line-height: 1.3; }
