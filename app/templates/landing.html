{% extends "base.html" %}
{% block title %}{{ title }} – GeoFast API{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>{{ title }}</h1>
    <p class="meta">{{ description }}</p>
  </header>
  <div class="card">
    <h2 class="card-title">Explore the API</h2>
    <ul class="links">
      {% for link in links %}
      <li>
        <a href="{{ link.href }}" rel="{{ link.rel }}">{{ link.title or link.rel }}</a>
        <span class="meta">({{ link.type }})</span>
      </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
