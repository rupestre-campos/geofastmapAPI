      wrap.appendChild(menu);

      function renderMenu() {
        var q = (inputEl.value || '').toLowerCase();
        var list = _ruleFieldKeys || [];
        if (q) list = list.filter(function(k) { return String(k).toLowerCase().indexOf(q) !== -1; });
        var html = list.slice(0, 300).map(function(k) {
          return '<div class="vector-rule-field-item" data-val="' + _escHtml(k) + '">' + _escHtml(k) + '</div>';
        }).join('');
        menu.innerHTML = html || '<div class="vector-rule-field-item" style="cursor:default;color:var(--text-secondary);">No matches</div>';
        menu.querySelectorAll('.vector-rule-field-item[data-val]').forEach(function(item) {
          item.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            inputEl.value = item.getAttribute('data-val') || '';
            menu.classList.remove('open');
            inputEl.dispatchEvent(new Event('input'));
            inputEl.dispatchEvent(new Event('change'));
          };
        });
      }

      function openMenu() {
        renderMenu();
        menu.classList.add('open');
      }
      function closeMenu() { menu.classList.remove('open'); }

      inputEl.addEventListener('focus', function() { openMenu(); });
      inputEl.addEventListener('click', function(e) { e.stopPropagation(); openMenu(); });
      inputEl.addEventListener('input', function() { if (menu.classList.contains('open')) renderMenu(); });
      document.addEventListener('click', function() { closeMenu(); });
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeMenu(); }
      });
    }

    function _renderRules() {
      if (!rulesListEl) return;
      rulesListEl.innerHTML = '';
      _rules.forEach(function(r, idx) {
        var card = document.createElement('div');
        card.className = 'vector-rule-card';
        var when = r.when || {};
        var paint = r.paint || {};
        card.innerHTML =
          '<div class="vector-rule-row">' +
            '<span class="rule-mini">IF</span>' +
            '<label>Field <input type="text" class="rule-field" list="vector-rule-fields" value="' + (when.field || '') + '" placeholder="e.g. test1"></label>' +
            '<label>Op <select class="rule-op">' +
              '<option value="eq">=</option><option value="ne">≠</option><option value="in">in</option><option value="contains">contains</option>' +
              '<option value="gt">&gt;</option><option value="gte">&ge;</option><option value="lt">&lt;</option><option value="lte">&le;</option>' +
            '</select></label>' +
            '<label>Value <input type="text" class="rule-value" value="' + (when.value == null ? '' : String(when.value)) + '" placeholder="YES"></label>' +
            '<label class="rule-mini">Zoom</label>' +
            '<label>min <input type="number" class="rule-minzoom" min="0" max="22" value="' + (r.minzoom == null ? '' : String(r.minzoom)) + '" placeholder="0"></label>' +
            '<label>max <input type="number" class="rule-maxzoom" min="0" max="22" value="' + (r.maxzoom == null ? '' : String(r.maxzoom)) + '" placeholder="22"></label>' +
            '<span class="vector-rule-actions">' +
              '<button type="button" class="btn btn-sm btn-danger rule-remove">Remove</button>' +
            '</span>' +
          '</div>' +
          '<div class="vector-rule-row" style="margin-top:8px;">' +
            '<span class="rule-mini">THEN</span>' +
            '<label>Fill <input type="color" class="rule-fill-color" value="' + (paint.fillColor || '#000000') + '"></label>' +
            '<label>Line <input type="color" class="rule-line-color" value="' + (paint.lineColor || '#000000') + '"></label>' +
            '<label>Point <input type="color" class="rule-point-color" value="' + (paint.pointColor || '#000000') + '"></label>' +
            '<label>Width <input type="number" class="rule-line-width" min="0.5" max="20" step="0.5" value="' + (paint.lineWidth == null ? '' : String(paint.lineWidth)) + '" placeholder="(no change)"></label>' +
            '<label>Opacity <input type="number" class="rule-line-opacity" min="0" max="1" step="0.05" value="' + (paint.lineOpacity == null ? '' : String(paint.lineOpacity)) + '" placeholder="(no change)"></label>' +
          '</div>';
        rulesListEl.appendChild(card);
        var opSel = card.querySelector('.rule-op');
        if (opSel) opSel.value = (when.op || 'eq');
        var fieldInput = card.querySelector('.rule-field');
        _attachFieldDropdown(fieldInput);
        function syncFromInputs() {
          var field = (card.querySelector('.rule-field').value || '').trim();
          var op = (card.querySelector('.rule-op').value || 'eq');
          var val = (card.querySelector('.rule-value').value || '');
          var minz = card.querySelector('.rule-minzoom').value;
          var maxz = card.querySelector('.rule-maxzoom').value;
          var fc = card.querySelector('.rule-fill-color').value;
          var lc = card.querySelector('.rule-line-color').value;
          var pc = card.querySelector('.rule-point-color').value;
          var lw = card.querySelector('.rule-line-width').value;
          var lo = card.querySelector('.rule-line-opacity').value;
          var rr = _rules[idx];
          rr.when = { field: field, op: op, value: val };
          rr.minzoom = minz === '' ? null : parseFloat(minz);
          rr.maxzoom = maxz === '' ? null : parseFloat(maxz);
          rr.paint = rr.paint || {};
          // Only apply colors when checkbox-like intent: user changed away from default black OR we already had a value
          rr.paint.fillColor = fc;
          rr.paint.lineColor = lc;
          rr.paint.pointColor = pc;
          rr.paint.lineWidth = lw === '' ? null : parseFloat(lw);
          rr.paint.lineOpacity = lo === '' ? null : parseFloat(lo);
          refreshStyle();
        }
        card.querySelectorAll('input, select').forEach(function(el) {
          el.oninput = el.onchange = syncFromInputs;
        });
        var rm = card.querySelector('.rule-remove');
        if (rm) rm.onclick = function() { _rules.splice(idx, 1); _renderRules(); refreshStyle(); };
      });
    }
    if (addRuleBtn) {
      addRuleBtn.onclick = function() {
        _rules.push({ when: { field: '', op: 'eq', value: '' }, paint: { fillColor: '#ff0000', lineColor: '#ff0000', pointColor: '#ff0000' }, minzoom: null, maxzoom: null });
        _renderRules();
        refreshStyle();
      };
    }
    window.GeofastmapStyleEditor.getRulesSpec = function() { return _rules.slice(); };
    window.GeofastmapStyleEditor.setRulesSpec = function(rules) { _rules = Array.isArray(rules) ? rules.slice() : []; _renderRules(); };
    window.GeofastmapStyleEditor.setRuleFieldOptions = function(keys) {
      var dl = document.getElementById('vector-rule-fields');
      if (!dl) return;
      _ruleFieldKeys = (Array.isArray(keys) ? keys : []).slice();
      dl.innerHTML = '';
      (Array.isArray(keys) ? keys : []).forEach(function(k) {
        if (!k) return;
        var opt = document.createElement('option');
        opt.value = String(k);
        dl.appendChild(opt);
      });
    };

    applySpecToForm(mergedDefaultSpec);

    function bindZoomToggle(id, stopsId) {
      var el = document.getElementById(id);
      var stops = document.getElementById(stopsId);
      if (!el || !stops) return;
      el.onchange = function() {
        stops.style.display = this.checked ? '' : 'none';
        if (this.checked) renderZoomStops(stopsId, null, refreshStyle);
        else refreshStyle();
      };
    }
    bindZoomToggle('fill-opacity-by-zoom', 'fill-opacity-zoom-stops');
    bindZoomToggle('line-width-by-zoom', 'line-width-zoom-stops');
    bindZoomToggle('line-opacity-by-zoom', 'line-opacity-zoom-stops');
    bindZoomToggle('point-size-by-zoom', 'point-size-zoom-stops');
    bindZoomToggle('point-opacity-by-zoom', 'point-opacity-zoom-stops');
    // Do not call renderZoomStops(id, null) here: applySpecToForm(mergedDefaultSpec) already populated
    // each zoom list from the saved spec. Resetting with null overwrites saved breakpoints and triggers
    // refreshStyle/onAfterApply with default stops (breaking pointSizeZoom, pointOpacityZoom, etc.).

    if (fillCheck) fillCheck.onchange = refreshStyle;
    if (lineCheck) lineCheck.onchange = refreshStyle;
    if (pointCheck) pointCheck.onchange = refreshStyle;
    if (fillColor) fillColor.oninput = refreshStyle;
    if (fillOpacity) fillOpacity.oninput = function() { fillOpacityVal.textContent = this.value; refreshStyle(); };
    if (lineColor) lineColor.oninput = refreshStyle;
    if (lineWidth) lineWidth.oninput = refreshStyle;
    if (lineOpacity) lineOpacity.oninput = function() { lineOpacityVal.textContent = this.value; refreshStyle(); };
    if (linePattern) linePattern.onchange = refreshStyle;
    if (pointColor) pointColor.oninput = refreshStyle;
    if (pointOpacity) pointOpacity.oninput = function() { if (pointOpacityVal) pointOpacityVal.textContent = this.value; refreshStyle(); };
    if (pointSize) pointSize.oninput = refreshStyle;
    if (pointIcon) pointIcon.onchange = refreshStyle;

    window.GeofastmapStyleEditor = window.GeofastmapStyleEditor || {};
    window.GeofastmapStyleEditor.LINE_DASH = LINE_DASH;
    window.GeofastmapStyleEditor.defaultSpec = mergedDefaultSpec;
    window.GeofastmapStyleEditor.ZOOM_STOP_DEFAULTS = ZOOM_STOP_DEFAULTS;
    window.GeofastmapStyleEditor.getStopsFromContainer = getStopsFromContainer;
    window.GeofastmapStyleEditor.renderZoomStops = renderZoomStops;
    window.GeofastmapStyleEditor.zoomStopsToExpression = zoomStopsToExpression;
    window.GeofastmapStyleEditor.getCurrentSpec = getCurrentSpec;
    window.GeofastmapStyleEditor.applySpecToForm = applySpecToForm;
    window.GeofastmapStyleEditor.applyVectorStyleToLayers = function(spec) { applyVectorStyleToLayers(map, getLayerIds(), spec || getCurrentSpec(), formEls); };
    window.GeofastmapStyleEditor.updateStyleLegend = function(spec) { updateStyleLegend(spec || getCurrentSpec(), legendElId); };
  }

  window.GeofastmapStyleEditor = window.GeofastmapStyleEditor || {};
  window.GeofastmapStyleEditor.initToolbox = initToolbox;
  window.GeofastmapStyleEditor.applyVectorStyleToLayers = applyVectorStyleToLayers;
  window.GeofastmapStyleEditor.defaultSpec = baseDefaultSpec;
  window.GeofastmapStyleEditor.LINE_DASH = LINE_DASH;
  window.GeofastmapStyleEditor.zoomStopsToExpression = zoomStopsToExpression;
  window.GeofastmapStyleEditor.updateLoadStyleTrigger = function() {};
  if (window.__styleEditorConfig) initToolbox(window.__styleEditorConfig);
})();
</script>
