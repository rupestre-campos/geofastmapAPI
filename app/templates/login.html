{% extends "base.html" %}
{% block title %}Login – GeoFast API{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>Login</h1>
    <p class="meta">Sign in to create and edit collections, maps, and styles.</p>
  </header>

  <div class="card">
    <h2 class="card-title">Sign in</h2>
    {% if error %}
    <p class="meta" style="color: var(--danger); margin-bottom: 1rem;">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ base }}/auth/login" class="js-auth-password-hash">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="password-toggle js-password-toggle" aria-label="Show password">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Sign in</button>
        <a href="{{ next_url }}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
{% block script %}
  <script src="{{ base }}/static/js/auth-hash.js"></script>
  <script src="{{ base }}/static/js/password-toggle.js"></script>
{% endblock %}
