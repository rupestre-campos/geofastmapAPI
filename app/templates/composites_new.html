{% extends "base.html" %}
{% block title %}New composite – GeoFastMap API{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>New composite collection</h1>
    <p class="breadcrumb">
      <a href="{{ base }}/composites?f=html">Composites</a> › New
    </p>
  </header>

  <div class="card">
    <h2 class="card-title">Create</h2>
    <form id="form-create-composite">
      <div class="form-row">
        <label for="create-id">ID <span class="meta">(required, e.g. regional_mosaic)</span></label>
        <input type="text" id="create-id" name="id" required placeholder="regional_mosaic">
      </div>
      <div class="form-row">
        <label for="create-title">Title</label>
        <input type="text" id="create-title" name="title" placeholder="Optional display name">
      </div>
      <div class="form-row">
        <label for="create-description">Description</label>
        <input type="text" id="create-description" name="description" placeholder="Optional">
      </div>
      <div class="form-row">
        <label for="create-members">Initial members <span class="meta">(optional — add more on edit page)</span></label>
        <select id="create-members" name="members" multiple size="8" style="min-width: 20rem;">
          {% for c in vector_collections %}
          <option value="{{ c.id }}">{{ c.id }}{% if c.title and c.title != c.id %} — {{ c.title }}{% endif %}</option>
          {% endfor %}
        </select>
        <p class="meta">Hold Ctrl/Cmd to select multiple. Order follows selection order.</p>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Create composite</button>
        <a href="{{ base }}/composites?f=html" class="btn">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
{% block script %}
  <script>
    const base = {{ base | tojson }};
    document.getElementById('form-create-composite').onsubmit = function(e) {
      e.preventDefault();
      const id = document.getElementById('create-id').value.trim();
      const title = document.getElementById('create-title').value.trim();
      const description = document.getElementById('create-description').value.trim();
      const sel = document.getElementById('create-members');
      const memberIds = Array.from(sel.selectedOptions).map(o => o.value);
      const body = { id: id, collection_type: 'composite' };
      if (title) body.title = title;
      if (description) body.description = description;
      if (memberIds.length) {
        body.composite_members = memberIds.map(cid => ({ collection_id: cid }));
      }
      fetch(base + '/composites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body)
      }).then(r => {
        if (!r.ok) return r.json().then(j => Promise.reject(j));
        return r.json();
      }).then(() => {
        location.href = base + '/composites/' + encodeURIComponent(id) + '/edit?f=html';
      }).catch(e => alert('Error: ' + (e.detail || JSON.stringify(e))));
    };
  </script>
{% endblock %}
