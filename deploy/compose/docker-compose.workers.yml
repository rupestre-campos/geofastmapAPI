# Bulk, tile, and process workers. Create deploy/env/.env.workers first (see deploy/env/workers.sample).
#   docker compose -f deploy/compose/docker-compose.workers.yml up -d --build
name: geofastmap_api

services:
  worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geofastmap_worker
    env_file:
      - ../env/.env.workers
    volumes:
      - geofastmap_bulk_uploads:/data/bulk-uploads
      # Required for raster imports: same path as API/Titiler RASTER_STORAGE_PATH
      - geofastmap_rasters:/data/rasters
    command: python -m app.worker_main

  tile_worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geofastmap_tile_worker
    env_file:
      - ../env/.env.workers
    volumes:
      - geofastmap_tiles:/data/tiles
    command: python -m app.tile_worker_main
    cpus: "4"
    mem_limit: 8g

  # Dynamic MVT encode workers (LIFO Redis jobs). DB stays on API; workers only encode.
  # Requires TILES_DYNAMIC_USE_QUEUE=true in API and worker env.
  dynamic_tile_worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geofastmap_dynamic_tile_worker
    env_file:
      - ../env/.env.workers
    environment:
      TILES_DYNAMIC_USE_QUEUE: "true"
      # 0 = auto (min(cpu_count, 8)); raise on large hosts
      TILES_DYNAMIC_QUEUE_CONCURRENCY: "0"
    command: python -m app.tile_queue_worker
    cpus: "4"
    mem_limit: 4g

  process_worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geofastmap_process_worker
    env_file:
      - ../env/.env.workers
    command: python -m app.process_worker_main

  mosaic_worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geofastmap_mosaic_worker
    env_file:
      - ../env/.env.workers
    command: python -m app.mosaic_worker_main

volumes:
  geofastmap_bulk_uploads:
  geofastmap_tiles:
  geofastmap_rasters:
