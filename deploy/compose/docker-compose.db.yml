# PostGIS only. From repo root:
#   docker compose -f deploy/compose/docker-compose.db.yml up -d
name: geofastmap_api

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: geofastmap_db
    shm_size: "256mb"
    environment:
      POSTGRES_DB: geofastmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d geofastmap -c 'select 1' -q || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5434:5432"
    volumes:
      - geofastmap_pgdata:/var/lib/postgresql/data
      - ../../docker/init-pg_trgm.sql:/docker-entrypoint-initdb.d/02-pg_trgm.sql

volumes:
  geofastmap_pgdata:
