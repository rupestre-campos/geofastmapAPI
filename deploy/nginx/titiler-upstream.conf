# Example: pool multiple Titiler instances. Mount into nginx or include from main config.
# Replace titiler_a / titiler_b with container names, Docker DNS names, or host:port.

upstream titiler_backends {
    least_conn;
    server titiler_a:8000;
    server titiler_b:8000;
}

server {
    listen 8080;
    location / {
        proxy_pass http://titiler_backends;
        proxy_http_version 1.1;
        # We do not use websocket upgrades on this path; drop Upgrade noise.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}
